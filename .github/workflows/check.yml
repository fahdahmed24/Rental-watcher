name: Check rental availability

on:
  schedule:
    # Check every five minutes
    - cron: "*/5 * * * *"

    # Daily email at 12:00 PM UTC
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rental:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Check game availability
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        env:
          CHECK_MODE: check
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check.py

      - name: Send daily email
        if: github.event.schedule == '0 12 * * *'
        env:
          CHECK_MODE: daily
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check.py

      - name: Save status
        if: always() && hashFiles('state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update rental watcher state"
          git push
