name: Check rental availability

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rental-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Debug secret
        run: |
          if [ -z "$PRODUCT_URL" ]; then
            echo "PRODUCT_URL is EMPTY or MISSING"
          else
            echo "PRODUCT_URL exists, length: ${#PRODUCT_URL}"
          fi
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}

      - name: Run availability check
        if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
        run: python check.py --mode check
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Run daily update
        if: github.event.schedule == '0 22 * * *'
        run: python check.py --mode daily
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Save state
        run: |
          git config user.name "rental-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state"
          git pull --rebase
          git push
